<h2 mat-dialog-title>{{ data ? 'Editar' : 'Nueva' }} bodega</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ubicación</mat-label>
      <input matInput formControlName="ubicacion">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Superficie (m²)</mat-label>
      <input type="number" matInput formControlName="superficieM2">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio mensual (MXN)</mat-label>
      <input type="number" matInput formControlName="precioMensual">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Disponible</mat-label>
      <select matNativeControl formControlName="disponible">
        <option [value]="true">Sí</option>
        <option [value]="false">No</option>
      </select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">Guardar</button>
</mat-dialog-actions>
