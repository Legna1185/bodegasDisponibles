<mat-card>
  <div class="toolbar">
    <button mat-raised-button color="primary" (click)="newBodega()">Nueva bodega</button>
    <span class="spacer"></span>
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input matInput #filterInput (keyup)="applyFilter(filterInput.value)" placeholder="Nombre o ubicación" />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
    <!-- columnas -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let el">{{el.id}}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let el">{{el.nombre}}</td>
    </ng-container>

    <ng-container matColumnDef="ubicacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ubicación</th>
      <td mat-cell *matCellDef="let el">{{el.ubicacion}}</td>
    </ng-container>

    <ng-container matColumnDef="superficieM2">
  <th mat-header-cell *matHeaderCellDef>Superficie (m²)</th>
  <td mat-cell *matCellDef="let el">{{el.superficieM2}}</td>
</ng-container>

    <ng-container matColumnDef="precioMensual">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
      <td mat-cell *matCellDef="let el">{{el.precioMensual | currency:'MXN'}}</td>
    </ng-container>

    <ng-container matColumnDef="disponible">
  <th mat-header-cell *matHeaderCellDef>Disponible</th>
  <td mat-cell *matCellDef="let el">{{el.disponible ? 'Sí' : 'No'}}</td>
</ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let el">
        <button mat-icon-button color="primary" (click)="edit(el)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5,10,20]"></mat-paginator>
</mat-card>
